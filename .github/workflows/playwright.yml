name: Playwright Mobile Automation Suite

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    # 18:30 UTC = 00:00 IST (midnight, Asia/Kolkata). GitHub Actions cron is
    # always UTC - there's no native timezone field, so the offset is baked
    # into the numbers below. If you're not in IST, adjust the hour: cron
    # hour = (desired local hour) - (your UTC offset), wrapped into 0-23.
    - cron: '30 18 * * *'

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14